[package]
name = "test-async-gd-ext"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = "0.4.0"
pin-project = "1.1.10"
reqwest = "0.12.24"
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread"] }
tokio-run-until-stalled = "0.1.0"

[patch.crates-io]
godot = { git = "https://github.com/godot-rust/gdext.git", tag = "v0.4.0" }
